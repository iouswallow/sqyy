<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>数据目录详情 · 数智中台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/standard.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
</head>
<body>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/components.js"></script>

  <script>
    LGApp.mountShell({ active: "catalog", topTitle: "数据目录详情", topSub: "我的发布 / 数据目录" });
    LGComp.mountDetailPage({
      id: LGApp.qs("id"),
      type: "catalog",
      typeLabel: "数据目录",
      titleKey: "title",
      listLabel: "数据目录发布",
      listHref: "pages/publish/catalog-list.html",
      fields: [
        {
          section: "基本信息",
          items: [
            { label: "目录名称", key: "title", required: true, placeholder: "请输入数据目录名称", full: true },
            { label: "数据分类", key: "category", type: "select", required: true, options: ["政务数据", "行业数据", "环境数据", "民生数据", "经济数据", "其他"] },
            { label: "数据来源", key: "source", required: true, placeholder: "请输入数据提供方" },
            { label: "数据格式", key: "format", type: "select", options: ["API", "CSV", "API/CSV", "Kafka", "Excel", "数据库", "瓦片"] },
            { label: "记录数", key: "records", type: "number", placeholder: "数据记录条数", hint: "预计数据量，单位：条" },
            { label: "更新频率", key: "updateCycle", extra: true, placeholder: "如：日更/实时/月更", hint: "数据更新周期" },
            { label: "共享范围", key: "securityLevel", extra: true, type: "select", options: ["公开", "内部", "受限", "涉密"] }
          ]
        },
        {
          section: "目录描述",
          items: [
            { label: "目录描述", key: "description", type: "textarea", required: true, placeholder: "请描述数据目录的覆盖范围、字段、用途等…", full: true, hint: "建议不少于 30 字，便于审批方理解数据价值" }
          ]
        }
      ]
    });
  </script>
</body>
</html>
