<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>产品发布 · 数智中台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/standard.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
</head>
<body>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/components.js"></script>

  <script>
    LGApp.mountShell({ active: "product", topTitle: "产品发布", topSub: "我的发布 / 产品" });
    LGComp.mountListPage({
      type: "product",
      typeLabel: "数据产品",
      crumb: [{ label: "我的发布" }, { label: "产品发布" }],
      title: "产品发布",
      subtitle: "管理已发布与待发布的数据产品工单",
      listHref: "pages/publish/product-list.html",
      detailHref: "product-detail.html",
      allowNew: true,
      columns: [
        { key: "id", title: "工单编号", width: "150px", render: function (r) { return '<span class="cell-id">' + r.id + '</span>'; } },
        { key: "title", title: "产品名称", render: function (r) { return '<div class="cell-title">' + LGComp.escapeHtml(r.title) + '</div><div class="text-3" style="font-size:12px;">' + LGComp.escapeHtml(r.category) + '</div>'; } },
        { key: "source", title: "产品归属", render: function (r) { return LGComp.tag(r.source); } },
        { key: "format", title: "交付形式", render: function (r) { return '<span class="text-2">' + LGComp.escapeHtml(r.format) + '</span>'; } },
        { key: "status", title: "状态", render: function (r) { return LGComp.badge(r.status); } },
        { key: "updatedAt", title: "更新时间", render: function (r) { return '<span class="text-3" style="font-size:13px;">' + r.updatedAt + '</span>'; } }
      ]
    });
  </script>
</body>
</html>
